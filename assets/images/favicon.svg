<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="title desc">
  <title id="title">MSN Website Icon</title>
  <desc id="desc">A branded icon with a gradient rounded square and the white MSN logo text.</desc>
  <defs>
    <linearGradient id="icon-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <mask id="text-mask">
      <rect width="120" height="120" rx="30" fill="white"/>
      <text x="60" y="75" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-weight="800" font-size="52" letter-spacing="-2" fill="black">MSN</text>
    </mask>
  </defs>
  <rect width="120" height="120" rx="30" fill="url(#icon-gradient)"/>
  <g filter="url(#shadow)">
    <rect x="10" y="10" width="100" height="100" rx="26" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  </g>
  <text x="60" y="76" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-weight="800" font-size="52" fill="#ffffff">MSN</text>
  <circle cx="95" cy="28" r="5" fill="#ffffff" opacity="0.9"/>
</svg>
